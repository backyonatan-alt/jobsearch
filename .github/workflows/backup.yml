name: backup

# THROWAWAY OVERRIDE — Aug 14 pulse check (revert after).

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Read-only aggregates
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'sudo -u postgres psql -X -q jobsearch' <<'SQL'
          \echo === signups since Aug 13 (non-admin) ===
          SELECT created_at::date AS day, split_part(email,'@',2) AS domain, count(*)
          FROM users WHERE NOT is_admin AND created_at >= '2026-08-13' GROUP BY 1,2 ORDER BY 1;
          \echo === events since Aug 13 by name (non-admin) ===
          SELECT e.name, count(*) AS n, count(DISTINCT e.user_id) AS users
          FROM events e JOIN users u ON u.id = e.user_id
          WHERE NOT u.is_admin AND e.created_at >= '2026-08-13'
          GROUP BY 1 ORDER BY 2 DESC;
          \echo === beta_interest since Aug 13 ===
          SELECT count(*) FROM beta_interest WHERE created_at >= '2026-08-13';
          SQL
