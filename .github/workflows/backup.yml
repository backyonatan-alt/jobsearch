name: backup

# TEMPORARY branch-only override (Aug 2 2026): read-only aggregate snapshot —
# pre-send health check before the wider student email wave. Counts only —
# no emails, no row data. Reverted on this branch right after the run.

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Read-only aggregate snapshot
        run: |
          cat > read.sql <<'SQL'
          \echo ===TOTAL_USERS===
          SELECT count(*) AS total_users FROM users;
          \echo ===SIGNUPS_PER_DAY_SINCE_JUL16_BY_DOMAIN_CLASS===
          SELECT created_at::date AS day,
                 CASE WHEN email ILIKE '%bgu.ac.il' THEN 'bgu'
                      WHEN email ILIKE '%gmail.com' THEN 'gmail'
                      ELSE 'other' END AS domain_class,
                 count(*) AS signups
          FROM users
          WHERE created_at >= '2026-07-16'
          GROUP BY 1, 2 ORDER BY 1, 2;
          \echo ===DAILY_ACTIVE_USERS_ANY_EVENT_LAST_14D===
          SELECT created_at::date AS day,
                 count(DISTINCT user_id) AS active_users,
                 count(*) AS events
          FROM events
          WHERE created_at >= now() - interval '14 days'
          GROUP BY 1 ORDER BY 1;
          \echo ===POST_DOMAIN_COHORT_FUNNEL_SINCE_JUL16===
          SELECT count(*) AS cohort_n,
                 count(*) FILTER (WHERE EXISTS (
                   SELECT 1 FROM applications a
                   WHERE a.user_id = u.id AND coalesce(a.notes, '') NOT LIKE '[demo]%'
                 )) AS with_real_app,
                 count(*) FILTER (WHERE EXISTS (
                   SELECT 1 FROM applications a
                   JOIN dossiers d ON d.application_id = a.id
                   WHERE a.user_id = u.id
                 )) AS with_playbook
          FROM users u
          WHERE u.created_at >= '2026-07-16';
          \echo ===COHORT_RETENTION_MULTIDAY_SINCE_JUL16===
          SELECT count(*) AS returned_users FROM (
            SELECT e.user_id
            FROM events e
            JOIN users u ON u.id = e.user_id
            WHERE u.created_at >= '2026-07-16'
            GROUP BY e.user_id
            HAVING count(DISTINCT e.created_at::date) >= 2
          ) t;
          \echo ===CREDITS_SPEND===
          SELECT count(*) FILTER (WHERE prep_credits_used > 0) AS users_spending,
                 sum(prep_credits_used) AS total_credits,
                 max(prep_credits_used) AS max_per_user,
                 count(*) FILTER (WHERE prep_credits_used >= prep_credits_limit
                                    AND prep_credits_limit < 1000) AS at_cap
          FROM users;
          \echo ===EVENT_ROLLUP_SINCE_JUL21===
          SELECT name, count(DISTINCT user_id) AS users, count(*) AS n
          FROM events
          WHERE created_at >= '2026-07-21'
          GROUP BY 1 ORDER BY n DESC LIMIT 40;
          \echo ===DEBRIEFS_TOTAL===
          SELECT count(*) AS debriefs, count(DISTINCT user_id) AS users
          FROM debriefs;
          SQL
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'sudo -u postgres psql -d jobsearch -v ON_ERROR_STOP=1 -P pager=off' < read.sql
