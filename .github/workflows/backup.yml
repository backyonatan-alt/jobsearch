name: backup

# THROWAWAY OVERRIDE — read-only aggregates for the Aug 13 re-read of the
# zero-generate fix (PR #55, live since Aug 9 ~15:40 UTC). Non-admin only, so
# the Aug 9 admin QA run is excluded automatically. Revert after the read.

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Read-only aggregates
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'sudo -u postgres psql -X -q jobsearch' <<'SQL'
          \echo === 1. signups since Aug 9 + credit spend (non-admin) ===
          SELECT count(*) AS new_users,
                 count(*) FILTER (WHERE prep_credits_used >= 1) AS spent_credit
          FROM users WHERE NOT is_admin AND created_at >= '2026-08-09';
          SELECT created_at::date AS day, split_part(email,'@',2) AS domain, count(*)
          FROM users WHERE NOT is_admin AND created_at >= '2026-08-09'
          GROUP BY 1,2 ORDER BY 1;
          \echo === 1b. all-time zero-credit share for context (non-admin) ===
          SELECT count(*) AS all_users,
                 count(*) FILTER (WHERE prep_credits_used = 0) AS zero_credit
          FROM users WHERE NOT is_admin;
          \echo === 2+3+4. new-instrumentation events since Aug 9 (non-admin) ===
          SELECT e.name, e.props, count(*) AS n, count(DISTINCT e.user_id) AS users
          FROM events e JOIN users u ON u.id = e.user_id
          WHERE NOT u.is_admin AND e.created_at >= '2026-08-09' AND e.name IN
            ('prepfirst_mode_toggle','prepfirst_submit','prepfirst_prompt_view',
             'prepfirst_skip','prepfirst_generate_ok','prepfirst_generate_error',
             'prepfirst_reground_submit','playbook_cta_view','playbook_cta_click',
             'onboard_variant_assigned')
          GROUP BY 1,2 ORDER BY 1,2;
          \echo === 5. daily activity since Aug 9 (non-admin) ===
          SELECT e.created_at::date AS day, count(DISTINCT e.user_id) AS users, count(*) AS events
          FROM events e JOIN users u ON u.id = e.user_id
          WHERE NOT u.is_admin AND e.created_at >= '2026-08-09'
          GROUP BY 1 ORDER BY 1;
          \echo === 5b. returning users (created before Aug 9, active Aug 10+) ===
          SELECT count(DISTINCT e.user_id) AS returning_users
          FROM events e JOIN users u ON u.id = e.user_id
          WHERE NOT u.is_admin AND e.created_at >= '2026-08-10' AND u.created_at < '2026-08-09';
          \echo === 5c. debriefs + dossier engagement since Aug 9 (non-admin) ===
          SELECT e.name, count(*) AS n, count(DISTINCT e.user_id) AS users
          FROM events e JOIN users u ON u.id = e.user_id
          WHERE NOT u.is_admin AND e.created_at >= '2026-08-09'
            AND e.name IN ('debrief_save','debrief_prompt_view','dossier_open','dossier_refresh','application_create','login')
          GROUP BY 1 ORDER BY 1;
          SELECT count(*) AS debriefs_ever FROM debriefs db
          JOIN interviews i ON i.id = db.interview_id
          JOIN applications a ON a.id = i.application_id
          JOIN users u ON u.id = a.user_id WHERE NOT u.is_admin;
          SQL
