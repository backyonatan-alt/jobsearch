name: backup

# THROWAWAY OVERRIDE (branch only, reverted after one run): read-only
# aggregate SQL for the Aug 26 day-7 read of student email round 2.
# No PII in output — counts only (public logs).

on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Day-7 aggregate read (non-admin; cohort = created >= 2026-08-19 15:45Z)
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo -u postgres psql -d jobsearch -X -q" <<'SQL'
          \pset footer off
          \echo === cohort funnel: signups / app / playbook(dossier) / spent credit ===
          SELECT count(*) FILTER (WHERE email ILIKE '%bgu.ac.il') AS bgu,
                 count(*) FILTER (WHERE email ILIKE '%gmail.com') AS gmail,
                 count(*) AS signups,
                 count(*) FILTER (WHERE EXISTS
                   (SELECT 1 FROM applications a WHERE a.user_id = u.id)) AS with_app,
                 count(*) FILTER (WHERE EXISTS
                   (SELECT 1 FROM applications a JOIN dossiers d ON d.application_id = a.id
                    WHERE a.user_id = u.id)) AS with_playbook,
                 count(*) FILTER (WHERE prep_credits_used > 0) AS spent_credit
          FROM users u WHERE NOT is_admin AND created_at >= '2026-08-19 15:45+00';
          \echo === cohort retention: active on 2+ distinct days / active since Aug 23 ===
          SELECT count(*) FILTER (WHERE days >= 2) AS multi_day,
                 count(*) FILTER (WHERE last_ev >= '2026-08-23') AS active_since_aug23
          FROM (SELECT u.id, count(DISTINCT date(e.created_at)) AS days,
                       max(e.created_at) AS last_ev
                FROM users u JOIN events e ON e.user_id = u.id
                WHERE NOT u.is_admin AND u.created_at >= '2026-08-19 15:45+00'
                GROUP BY u.id) s;
          \echo === all-time zero-credit share (non-admin) ===
          SELECT count(*) AS users,
                 count(*) FILTER (WHERE prep_credits_used = 0) AS zero_credit
          FROM users WHERE NOT is_admin;
          \echo === prepfirst by mode since send (non-admin) ===
          SELECT e.name, coalesce(e.props->>'mode','') AS mode,
                 count(DISTINCT e.user_id) AS users, count(*) AS n
          FROM events e JOIN users u ON u.id = e.user_id
          WHERE NOT u.is_admin AND e.created_at >= '2026-08-19 15:45+00'
            AND e.name IN ('prepfirst_prompt_view','prepfirst_mode_toggle',
                           'prepfirst_submit','prepfirst_generate_ok',
                           'prepfirst_generate_error','prepfirst_skip',
                           'prepfirst_reground_submit')
          GROUP BY 1,2 ORDER BY 1,2;
          \echo === login src since send (reminder returns?) ===
          SELECT coalesce(e.props->>'src','(none)') AS src,
                 count(DISTINCT e.user_id) AS users, count(*) AS logins
          FROM events e JOIN users u ON u.id = e.user_id
          WHERE NOT u.is_admin AND e.name = 'login'
            AND e.created_at >= '2026-08-19 15:45+00'
          GROUP BY 1 ORDER BY 2 DESC;
          \echo === reminder emails sent, by kind: since send / all time ===
          SELECT kind, count(*) FILTER (WHERE sent_at >= '2026-08-19 15:45+00') AS since_send,
                 count(*) AS all_time
          FROM sent_emails GROUP BY 1;
          \echo === cv_save users: since send / all time (non-admin) ===
          SELECT count(DISTINCT e.user_id) FILTER (WHERE e.created_at >= '2026-08-19 15:45+00') AS since_send,
                 count(DISTINCT e.user_id) AS all_time
          FROM events e JOIN users u ON u.id = e.user_id
          WHERE NOT u.is_admin AND e.name = 'cv_save';
          \echo === debriefs + prep accuracy (non-admin): all time / since send ===
          SELECT coalesce(nullif(d.prep_accuracy,''),'(unrated)') AS accuracy,
                 count(*) AS all_time,
                 count(*) FILTER (WHERE d.created_at >= '2026-08-19 15:45+00') AS since_send,
                 count(DISTINCT d.user_id) AS users
          FROM debriefs d JOIN users u ON u.id = d.user_id
          WHERE NOT u.is_admin GROUP BY 1 ORDER BY 2 DESC;
          \echo === trust events since send (non-admin) ===
          SELECT e.name, count(DISTINCT e.user_id) AS users, count(*) AS n
          FROM events e JOIN users u ON u.id = e.user_id
          WHERE NOT u.is_admin AND e.created_at >= '2026-08-19 15:45+00'
            AND e.name IN ('identity_confirmed','identity_rejected',
                           'identity_reresearch_submitted','debrief_save',
                           'dossier_open','brief_page_open','interview_save')
          GROUP BY 1 ORDER BY 1;
          SQL
