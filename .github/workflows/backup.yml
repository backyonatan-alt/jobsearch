name: backup

# THROWAWAY OVERRIDE — read-only aggregate stats for the Aug 4-5 student-cohort
# read (same pattern as the Jul 7/12/16/20 reads). Aggregates only, no PII in
# logs (public repo). Revert this commit after the read.

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Read-only aggregates
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'sudo -u postgres psql -X -q jobsearch' <<'SQL'
          \echo === total users ===
          SELECT count(*) AS total_users FROM users;
          \echo === signups per day, last 10 days ===
          SELECT created_at::date AS day, count(*) AS signups
          FROM users WHERE created_at >= now() - interval '10 days'
          GROUP BY 1 ORDER BY 1;
          \echo === new users since Aug 3 by email domain ===
          SELECT split_part(email, '@', 2) AS domain, count(*) AS n
          FROM users WHERE created_at >= '2026-08-03' GROUP BY 1 ORDER BY 2 DESC;
          \echo === login events since Aug 3: day x src ===
          SELECT created_at::date AS day, coalesce(props->>'src','(none)') AS src,
                 count(*) AS logins, count(DISTINCT user_id) AS users
          FROM events WHERE name = 'login' AND created_at >= '2026-08-03'
          GROUP BY 1,2 ORDER BY 1,2;
          \echo === all events since Aug 3 by name ===
          SELECT name, count(*) AS n, count(DISTINCT user_id) AS users
          FROM events WHERE created_at >= '2026-08-03'
          GROUP BY 1 ORDER BY 2 DESC;
          \echo === error-ish event props since Aug 3 ===
          SELECT name, props, count(*) FROM events
          WHERE created_at >= '2026-08-03' AND name LIKE '%error%'
          GROUP BY 1,2;
          \echo === new-cohort activation (users created since Aug 3) ===
          SELECT
            count(*) AS new_users,
            count(*) FILTER (WHERE EXISTS (SELECT 1 FROM applications a WHERE a.user_id = u.id)) AS with_app,
            count(*) FILTER (WHERE EXISTS (
              SELECT 1 FROM dossiers d JOIN applications a ON a.id = d.application_id
              WHERE a.user_id = u.id)) AS with_playbook
          FROM users u WHERE u.created_at >= '2026-08-03';
          \echo === per-new-user aggregate (id only, no email) ===
          SELECT u.id, u.created_at::date AS joined,
            (SELECT count(*) FROM applications a WHERE a.user_id = u.id) AS apps,
            (SELECT count(*) FROM dossiers d JOIN applications a ON a.id = d.application_id WHERE a.user_id = u.id) AS playbooks,
            (SELECT count(*) FROM events e WHERE e.user_id = u.id) AS events
          FROM users u WHERE u.created_at >= '2026-08-03' ORDER BY u.created_at;
          \echo === beta_interest since Aug 3 ===
          SELECT count(*) AS beta_interest_new FROM beta_interest WHERE created_at >= '2026-08-03';
          \echo === returning users Aug 4-5 (created before Aug 3, active since) ===
          SELECT count(DISTINCT e.user_id) AS returning_users
          FROM events e JOIN users u ON u.id = e.user_id
          WHERE e.created_at >= '2026-08-04' AND u.created_at < '2026-08-03';
          SQL
