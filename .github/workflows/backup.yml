name: backup

# THROWAWAY OVERRIDE — read-only aggregate stats for the Aug 8 student-cohort
# re-read (same pattern as Jul 7/12/16/20 + Aug 5). Aggregates only, no PII in
# logs (public repo). Revert this commit after the read.

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Read-only aggregates
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'sudo -u postgres psql -X -q jobsearch' <<'SQL'
          \echo === total users + signups per day since Aug 3 ===
          SELECT count(*) AS total_users FROM users;
          SELECT created_at::date AS day, count(*) AS signups
          FROM users WHERE created_at >= '2026-08-03' GROUP BY 1 ORDER BY 1;
          \echo === new users since Aug 6 by email domain ===
          SELECT split_part(email, '@', 2) AS domain, count(*) AS n
          FROM users WHERE created_at >= '2026-08-06' GROUP BY 1 ORDER BY 2 DESC;
          \echo === login events since Aug 5: day x src ===
          SELECT created_at::date AS day, coalesce(props->>'src','(none)') AS src,
                 count(*) AS logins, count(DISTINCT user_id) AS users
          FROM events WHERE name = 'login' AND created_at >= '2026-08-05'
          GROUP BY 1,2 ORDER BY 1,2;
          \echo === Aug 4-5 cohort per-user: apps, playbooks, later-day return ===
          SELECT u.id, u.created_at::date AS joined,
            (SELECT count(*) FROM applications a WHERE a.user_id = u.id) AS apps,
            (SELECT count(*) FROM dossiers d JOIN applications a ON a.id = d.application_id WHERE a.user_id = u.id) AS playbooks,
            (SELECT count(*) FROM events e WHERE e.user_id = u.id) AS events,
            (SELECT max(e.created_at)::date FROM events e WHERE e.user_id = u.id) AS last_seen,
            EXISTS (SELECT 1 FROM events e WHERE e.user_id = u.id
                    AND e.created_at::date > u.created_at::date) AS returned_later_day
          FROM users u
          WHERE u.created_at >= '2026-08-04' AND u.created_at < '2026-08-06'
          ORDER BY u.id;
          \echo === reground funnel since Aug 5 (recovery shipped Aug 5 ~15:20 UTC) ===
          SELECT name, props, count(*) AS n, count(DISTINCT user_id) AS users
          FROM events
          WHERE created_at >= '2026-08-05'
            AND (name IN ('prepfirst_reground_submit','prepfirst_generate_ok','prepfirst_generate_error','prepfirst_submit','prepfirst_skip','prepfirst_prompt_view'))
          GROUP BY 1,2 ORDER BY 1,2;
          \echo === all events since Aug 6 by name ===
          SELECT name, count(*) AS n, count(DISTINCT user_id) AS users
          FROM events WHERE created_at >= '2026-08-06'
          GROUP BY 1 ORDER BY 2 DESC;
          \echo === retention: pre-Aug-3 users active since Aug 6 ===
          SELECT count(DISTINCT e.user_id) AS returning_old_users
          FROM events e JOIN users u ON u.id = e.user_id
          WHERE e.created_at >= '2026-08-06' AND u.created_at < '2026-08-03';
          \echo === debrief activity since Aug 3 ===
          SELECT name, count(*) AS n, count(DISTINCT user_id) AS users
          FROM events WHERE created_at >= '2026-08-03' AND name LIKE 'debrief%'
          GROUP BY 1;
          \echo === identity/trust signals since Aug 5 ===
          SELECT name, count(*) AS n, count(DISTINCT user_id) AS users
          FROM events WHERE created_at >= '2026-08-05'
            AND name IN ('dossier_identity_open','identity_rejected','identity_confirmed','identity_reresearch_submitted','dossier_open','dossier_refresh')
          GROUP BY 1 ORDER BY 1;
          SQL
