name: backup

# THROWAWAY OVERRIDE (branch only, reverted after one run): read-only
# aggregate SQL for the Aug 21 light read of student email round 2.
# No PII in output — counts and event names only (public logs).

on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Aggregate read (non-admin, since send 2026-08-19 15:45Z)
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo -u postgres psql -d jobsearch -X -q" <<'SQL'
          \pset footer off
          \echo === signups since send, by domain ===
          SELECT count(*) FILTER (WHERE email ILIKE '%bgu.ac.il') AS bgu,
                 count(*) FILTER (WHERE email ILIKE '%gmail.com') AS gmail,
                 count(*) AS total
          FROM users WHERE NOT is_admin AND created_at >= '2026-08-19 15:45+00';
          \echo === total users (all time, non-admin) ===
          SELECT count(*) FROM users WHERE NOT is_admin;
          \echo === login src since send (non-admin) ===
          SELECT coalesce(e.props->>'src','(none)') AS src,
                 count(DISTINCT e.user_id) AS users, count(*) AS logins
          FROM events e JOIN users u ON u.id = e.user_id
          WHERE NOT u.is_admin AND e.name = 'login'
            AND e.created_at >= '2026-08-19 15:45+00'
          GROUP BY 1 ORDER BY 2 DESC;
          \echo === prepfirst events since send, by mode (non-admin) ===
          SELECT e.name, coalesce(e.props->>'mode','') AS mode,
                 count(DISTINCT e.user_id) AS users, count(*) AS n
          FROM events e JOIN users u ON u.id = e.user_id
          WHERE NOT u.is_admin AND e.created_at >= '2026-08-19 15:45+00'
            AND e.name IN ('prepfirst_prompt_view','prepfirst_mode_toggle',
                           'prepfirst_submit','prepfirst_generate_ok',
                           'prepfirst_generate_error','prepfirst_skip',
                           'prepfirst_reground_submit')
          GROUP BY 1,2 ORDER BY 1,2;
          \echo === generate errors since send: step/reason (non-admin) ===
          SELECT e.props->>'step' AS step, left(e.props->>'reason', 60) AS reason,
                 count(*) AS n
          FROM events e JOIN users u ON u.id = e.user_id
          WHERE NOT u.is_admin AND e.name = 'prepfirst_generate_error'
            AND e.created_at >= '2026-08-19 15:45+00'
          GROUP BY 1,2 ORDER BY 3 DESC;
          \echo === key adoption events since send (non-admin) ===
          SELECT e.name, count(DISTINCT e.user_id) AS users, count(*) AS n
          FROM events e JOIN users u ON u.id = e.user_id
          WHERE NOT u.is_admin AND e.created_at >= '2026-08-19 15:45+00'
            AND e.name IN ('cv_save','reminder_email_sent','dossier_open',
                           'dossier_refresh','application_create','interview_save',
                           'debrief_save','identity_rejected',
                           'identity_reresearch_submitted','playbook_cta_click',
                           'brief_page_open')
          GROUP BY 1 ORDER BY 1;
          \echo === new-cohort activation (users created since send) ===
          SELECT count(DISTINCT u.id) AS new_users_with_app
          FROM users u JOIN applications a ON a.user_id = u.id
          WHERE NOT u.is_admin AND u.created_at >= '2026-08-19 15:45+00';
          SELECT count(DISTINCT e.user_id) AS new_users_reached_playbook
          FROM events e JOIN users u ON u.id = e.user_id
          WHERE NOT u.is_admin AND u.created_at >= '2026-08-19 15:45+00'
            AND e.name IN ('prepfirst_generate_ok','dossier_refresh','brief_page_open');
          SQL
